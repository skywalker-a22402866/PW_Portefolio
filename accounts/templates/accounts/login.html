{% extends 'app/layout.html' %}

{% block content %}

<h1>Login</h1>

{% if error %}
    <p style="color:red">{{ error }}</p>
{% endif %}

<form method="POST">
    {% csrf_token %}

    <input type="text" name="username" placeholder="Username">
    <input type="password" name="password" placeholder="Password">

    <button type="submit">Entrar</button>
</form>

{% endblock %}
